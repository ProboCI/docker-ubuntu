<VirtualHost *:80>

  ServerName probo.build
  ServerAdmin hello@probo.ci
  DocumentRoot /var/www/html

  ErrorLog /var/log/apache2/error.log

  <Directory /var/www/html>
    Options FollowSymlinks
    AllowOverride All
    DirectoryIndex index.html index.htm index.php welcome.html
  </Directory>

  LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
  LogFormat "%a %l %u %t \"%r\" %>s %b" common

  LogFormat "%v %a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
  LogFormat "%v %a %l %u %t \"%r\" %>s %b" vhost_common

  CustomLog "/var/log/apache2/access.log" combined
  CustomLog "/var/log/apache2/vhost_access.log" vhost_combined

  ProxyPass "/solr/" "http://localhost:8983/solr/"
  ProxyPassReverse "/solr/" "http://localhost:8983/solr/"

</VirtualHost>


<VirtualHost *:443>

  ServerName probo.build
  ServerAdmin hello@probo.ci
  DocumentRoot /var/www/html

  ErrorLog /var/log/apache2/error.log

  <Directory /var/www/html>
    Options FollowSymlinks
    AllowOverride All
    DirectoryIndex index.html index.htm index.php welcome.html
  </Directory>

  LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
  LogFormat "%a %l %u %t \"%r\" %>s %b" common

  LogFormat "%v %a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
  LogFormat "%v %a %l %u %t \"%r\" %>s %b" vhost_common

  CustomLog "/var/log/apache2/access_ssl.log" combined
  CustomLog "/var/log/apache2/vhost_access_ssl.log" vhost_combined

  SSLCipherSuite HIGH:3DES:!aNULL:!MD5:!SEED:!IDEA
  SSLCertificateFile /etc/ssl/certs/localhost.crt
  SSLCertificateKeyFile /etc/ssl/private/localhost.key

  ProxyPass "/solr/" "http://localhost:8983/solr/"
  ProxyPassReverse "/solr/" "http://localhost:8983/solr/"

</VirtualHost>
